<!-- Include Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js"></script>

<!-- Contact Us Section -->
<section id="contact">
    <h2>Contact Us</h2>
    <p>We'd love to hear from you! Fill out the form below and we'll get back to you as soon as possible.</p>
    <form id="contactForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Your message" rows="5" required></textarea>
        </div>
        <button type="submit">Send Message</button>
    </form>
</section>

<script>
// Your Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyBgn7Dmgo4y8RjpCvWM_0jh8x0CjBd-7JE",
    authDomain: "staticservices-5f147.firebaseapp.com",
    projectId: "staticservices-5f147",
    storageBucket: "staticservices-5f147.appspot.com",
    messagingSenderId: "27215955705",
    appId: "1:27215955705:web:63e112ee5162a009800428",
    measurementId: "G-DFDZMEBFSG"
  };
// Initialize Firebase
firebase.initializeApp(firebaseConfig);

// Reference to the database
const database = firebase.database();

document.getElementById('contactForm').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent the default form submission

    // Get form data
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const message = document.getElementById('message').value;

    // Save form data to Firebase
    const newContactRef = database.ref('contacts').push();
    newContactRef.set({
        name: name,
        email: email,
        message: message
    });

    // Display a confirmation message
    alert('Your message has been sent!');

    // Optionally clear the form
    document.getElementById('contactForm').reset();
});
</script>
